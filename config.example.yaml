# Example configuration for Folder Watchdog Organizer

# Directories to watch for file changes
watch_directories:
  - /path/to/downloads
  - /path/to/desktop
  # Add more directories as needed

# Base directory where organized files will be moved
destination_directory: /path/to/organized

# Organization rules
organization_rules:
  skip_hidden_files: true
  skip_system_files: true
  handle_duplicates: rename  # Options: 'rename', 'skip', 'overwrite'

# Custom file categories (optional)
# You can add custom categories or override default ones
file_categories:
  # Example: Add custom category for data files
  data:
    - .json
    - .xml
    - .yaml
    - .yml
  # Example: Add custom category for design files
  design:
    - .psd
    - .ai
    - .sketch
    - .fig

# Logging configuration
logging:
  level: INFO  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: null  # Optional: specify a log file path, e.g., '/var/log/watchdog.log'
